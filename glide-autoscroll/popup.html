<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #17171c; --muted: #6b6b76; --line: #e7e7ec;
    --accent: #2f6df6; --track: #d5d5dd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b21; --fg: #ececf1; --muted: #9a9aa6; --line: #2d2d36; --accent: #6c9bff; --track: #3a3a45; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 280px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 22px; height: 22px; }
  header b { font-size: 14px; letter-spacing: -.01em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .label { display: flex; flex-direction: column; min-width: 0; }
  .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--track); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:disabled + span { opacity: .4; }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { padding: 0 16px 12px; color: var(--muted); font-size: 12px; }
  .note.small { font-size: 11.5px; padding-top: 2px; }
  .note code { font: 11px ui-monospace, monospace; }
  footer { border-top: 1px solid var(--line); padding: 10px 16px; }
  button { all: unset; cursor: pointer; color: var(--accent); font-weight: 500; }
  button:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><b>Glide Autoscroll</b></header>
  <div class="row">
    <div class="label"><span id="l-global">Enabled</span><span class="sub">Everywhere</span></div>
    <label class="switch"><input type="checkbox" id="global" aria-labelledby="l-global"><span></span></label>
  </div>
  <div class="row">
    <div class="label"><span id="l-site">On this site</span><span class="sub" id="host">—</span></div>
    <label class="switch"><input type="checkbox" id="site" aria-labelledby="l-site host"><span></span></label>
  </div>
  <div class="note" id="note" hidden></div>
  <div class="note small" id="private" hidden></div>
  <footer><button id="opts">Settings &amp; test area</button></footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
