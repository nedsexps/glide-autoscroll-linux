<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0}
#chat{position:absolute;left:20px;top:20px;width:300px;height:200px;overflow-y:auto;display:flex;flex-direction:column-reverse;border:1px solid #888}
#chat div{flex:none;height:40px;border-bottom:1px solid #ddd}
#rtl{position:absolute;left:360px;top:20px;width:300px;height:100px;overflow-x:auto;white-space:nowrap;border:1px solid #888}
#rtl span{display:inline-block;width:120px;height:80px;background:#ccd;margin:2px}
</style></head><body>
<div id=chat></div><div id=rtl dir=rtl></div>
<script>for(let i=0;i<100;i++){const d=document.createElement('div');d.textContent='msg '+i;chat.appendChild(d)}
for(let i=0;i<20;i++){rtl.appendChild(document.createElement('span'))}</script></body></html>
