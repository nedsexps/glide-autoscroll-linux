<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;font:16px sans-serif}
#text{position:absolute;left:20px;top:20px;width:500px}
#ta{position:absolute;left:20px;top:200px;width:300px;height:50px}
#ta2{position:absolute;left:360px;top:200px;width:300px;height:50px}
#embed{position:absolute;left:20px;top:300px;width:400px;height:150px;border:1px solid #888}

#tall{height:6000px}
</style></head><body>
<p id=text>The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs.</p>
<textarea id=ta></textarea><textarea id=ta2></textarea>
<iframe id=embed src="http://localhost:8124/fit.html"></iframe>
<dialog id=dlg><div id=dv><div style="height:2000px">modal scroller</div></div></dialog>
<div id=tall></div>
<script>
window.events=[];
['pointerdown','pointerup','mousedown','mouseup','auxclick','click','contextmenu'].forEach(t=>document.addEventListener(t,e=>events.push(t+':'+e.button)));
window.lastMoveTarget='';document.addEventListener('mousemove',e=>{lastMoveTarget=e.target.localName});
</script></body></html>
